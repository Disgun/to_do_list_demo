<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач (Итог Модуля I)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="todo-app">
            <h1>Менеджер задач</h1>
            <p class="counter">Всего задач: <span id="count">0</span></p>

            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Введите новую задачу">
                <button id="addBtn">Добавить</button>
            </div>

            <ul id="taskList"></ul>

            <button id="clearBtn" class="clear-btn">Очистить всё</button>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
